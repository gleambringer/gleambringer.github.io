<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play | Gleam</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="icon" type="image/png" href="../../favicon.png">
    <style>
        :root {
            --bg-dark: #0a050f;
            --theme-accent: #9d174d;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(157, 23, 77, 0.3);
        }

        body, html {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: white;
            min-height: 100vh;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        header {
            text-align: left;
            margin-bottom: 4rem;
            border-left: 4px solid var(--theme-accent);
            padding-left: 1.5rem;
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            margin: 0;
            text-transform: lowercase;
            letter-spacing: -2px;
        }

        .subtitle {
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.8rem;
        }

        /* Boxy Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .game-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 2.5rem 1.5rem;
            text-decoration: none;
            color: white;
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-end;
            aspect-ratio: 1 / 1;
            position: relative;
            overflow: hidden;
        }

        /* Hover Effect: Sharp and Bold */
        .game-card:hover {
            background: var(--theme-accent);
            border-color: #fff;
            transform: scale(1.02);
            box-shadow: 10px 10px 0px rgba(157, 23, 77, 0.3);
        }

        .game-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
            transition: transform 0.3s ease;
        }

        .game-card:hover .game-icon {
            transform: rotate(-10deg) scale(1.2);
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: lowercase;
            letter-spacing: -1px;
        }

        .game-meta {
            font-size: 0.7rem;
            text-transform: uppercase;
            opacity: 0.6;
            margin-top: 0.5rem;
        }

        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem;
            font-family: monospace;
            color: var(--theme-accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .back-nav {
            margin-top: 4rem;
        }

        .back-btn {
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.8rem 1.5rem;
            transition: 0.3s;
        }

        .back-btn:hover {
            border-color: white;
            color: white;
            background: rgba(255,255,255,0.05);
        }

        @media (max-width: 640px) {
            h1 { font-size: 3rem; }
            .games-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="content-wrapper">
        <header>
            <span class="subtitle">Entertainment / Library</span>
            <h1>play</h1>
        </header>

        <div id="game-list" class="games-grid">
            <div class="loader">Synchronizing fragments...</div>
        </div>

        <div class="back-nav">
            <a href="../" class="back-btn">← Back</a>
        </div>
    </div>

    <script>
        async function loadGames() {
            const container = document.getElementById('game-list');
            try {
                // Fetching from your specific GitHub path
                const response = await fetch('https://gleambringer.github.io/entertainment/play/list.json');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                container.innerHTML = ''; 

                if (data.games.length === 0) {
                    container.innerHTML = '<div class="loader">Library is currently empty.</div>';
                    return;
                }

                data.games.forEach(gameName => {
                    const card = document.createElement('a');
                    card.className = 'game-card';
                    // Assumes files follow the gamename.html or just /gamename directory structure
                    card.href = `https://gleambringer.github.io/entertainment/play/${gameName}`;
                    
                    // Format display name
                    const displayName = gameName.replace(/-/g, ' ');
                    
                    card.innerHTML = `
                        <div class="game-icon">◈</div>
                        <div class="game-title">${displayName}</div>
                        <div class="game-meta">Fragment #${Math.floor(Math.random()*9000)+1000}</div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Fetch error:', error);
                container.innerHTML = '<div class="loader">Error: Failed to fetch the gleam list.</div>';
            }
        }

        // Particle background logic (Simplified for performance)
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class P {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.s = Math.random() * 2;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if(this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = 'rgba(157, 23, 77, 0.3)';
                ctx.fillRect(this.x, this.y, this.s, this.s);
            }
        }

        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        window.onload = () => {
            initCanvas();
            for(let i=0; i<100; i++) particles.push(new P());
            animate();
            loadGames();
        };
    </script>
</body>
</html>
